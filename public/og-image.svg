<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="15%" r="35%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="30%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Badge -->
  <rect x="468" y="140" width="264" height="36" rx="18" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="600" y="164" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="2">TELC DEUTSCH C1</text>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#3b82f6" letter-spacing="-2">C1<tspan fill="#f1f5f9"> Werkstatt</tspan></text>

  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="-0.5">Interaktives Lernportal für die C1 Prüfung</text>

  <!-- Features -->
  <circle cx="270" cy="390" r="4" fill="#3b82f6"/>
  <text x="282" y="395" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Wortschatz</text>

  <circle cx="410" cy="390" r="4" fill="#3b82f6"/>
  <text x="422" y="395" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Grammatik</text>

  <circle cx="550" cy="390" r="4" fill="#3b82f6"/>
  <text x="562" y="395" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Schreiben</text>

  <circle cx="680" cy="390" r="4" fill="#3b82f6"/>
  <text x="692" y="395" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Lesen</text>

  <circle cx="780" cy="390" r="4" fill="#3b82f6"/>
  <text x="792" y="395" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Hören</text>

  <!-- Footer -->
  <text x="600" y="570" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#64748b">von <tspan fill="#94a3b8">Ioana Ognibeni</tspan> — kostenlos</text>
</svg>
